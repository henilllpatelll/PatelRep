version: 2
updates:
  # GitHub Actions — keeps workflow action versions current (no more node20 warnings)
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    groups:
      github-actions:
        patterns: ["*"]

  # npm — keeps web deps patched (CVEs, deprecation warnings, lock file in sync)
  - package-ecosystem: "npm"
    directory: "/apps/web"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    groups:
      # Patch + minor updates grouped into one PR to reduce noise
      non-major:
        update-types: ["minor", "patch"]
    # TEMPORARY: hold Tailwind on v3 until an intentional Tailwind 4 migration.
    # tailwind-merge 3 only supports Tailwind 4 class names (see known_incompatibilities
    # in .github/dependency-orchestrator.policy.json). Remove both entries together.
    ignore:
      - dependency-name: "tailwindcss"
        versions: [">=4.0.0"]
      - dependency-name: "tailwind-merge"
        versions: [">=3.0.0"]

  # pip — keeps Python deps patched (cryptography, pypdf, etc.)
  - package-ecosystem: "pip"
    directory: "/apps/api"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    groups:
      non-major:
        update-types: ["minor", "patch"]
