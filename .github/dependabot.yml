version: 2
updates:
  # GitHub Actions — keeps workflow action versions current (no more node20 warnings)
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    groups:
      github-actions:
        patterns: ["*"]

  # npm — keeps web deps patched (CVEs, deprecation warnings, lock file in sync)
  - package-ecosystem: "npm"
    directory: "/apps/web"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    groups:
      # Patch + minor updates grouped into one PR to reduce noise
      non-major:
        update-types: ["minor", "patch"]

  # pip — keeps Python deps patched (cryptography, pypdf, etc.)
  - package-ecosystem: "pip"
    directory: "/apps/api"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    groups:
      non-major:
        update-types: ["minor", "patch"]
