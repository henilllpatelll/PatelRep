name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-api:
    name: Lint / API
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install ruff
        run: pip install ruff==0.15.16
      - name: Lint
        run: cd apps/api && ruff check .

  lint-web:
    name: Lint + Type-check / Web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Install dependencies
        run: cd apps/web && npm ci
      - name: Lint
        run: cd apps/web && npm run lint
      - name: Type-check
        run: cd apps/web && npm run type-check

  build-web:
    name: Build / Web
    runs-on: ubuntu-latest
    needs: lint-web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Install dependencies
        run: cd apps/web && npm ci
      - name: Build
        run: cd apps/web && npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: "https://placeholder.supabase.co"
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBsYWNlaG9sZGVyIiwicm9sZSI6ImFub24iLCJpYXQiOjE2MDAwMDAwMDAsImV4cCI6OTk5OTk5OTk5OX0.ci-placeholder-not-a-real-key' }}
          NEXT_PUBLIC_API_URL: "https://patelrep-web-production.up.railway.app"

  test-web-public-smoke:
    name: Test / Web public smoke
    runs-on: ubuntu-latest
    needs: build-web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: apps/web/package-lock.json
      - name: Install dependencies
        run: cd apps/web && npm ci
      - name: Install Chromium
        run: cd apps/web && npx playwright install chromium
      - name: Run login readiness smoke
        run: cd apps/web && npx playwright test --config=playwright.phase0.config.ts

  test-api:
    name: Test / API
    runs-on: ubuntu-latest
    needs: lint-api
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: apps/api/requirements.txt
      - name: Install dependencies
        run: cd apps/api && pip install -r requirements.txt
      - name: Smoke tests
        run: cd apps/api && python -m pytest tests/smoke/ -v --tb=short
        env:
          SUPABASE_URL: "https://test.supabase.co"
          SUPABASE_SERVICE_ROLE_KEY: "test-key"
          SUPABASE_JWT_SECRET: "test-jwt-secret-minimum-32-characters-long!!"
          OPENAI_API_KEY: "test-key"
          ANTHROPIC_API_KEY: "test-key"
          STRIPE_SECRET_KEY: "sk_test_placeholder"
          STRIPE_WEBHOOK_SECRET: "stripe-webhook-secret-test"
          CRON_SECRET: "test-cron-secret"
          APP_ENV: "test"
          APP_URL: "http://localhost:3000"
          API_URL: "http://localhost:8000"

  database-migration-gate:
    name: Database Migration Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: supabase/setup-cli@v1
        with:
          version: 2.76.8
      - name: Check immutable migration history and destructive SQL review
        run: node scripts/check-migrations.mjs
      - name: Build and self-verify normalized migration replay workspace
        run: |
          node --test scripts/build-migration-replay-workspace.test.mjs
          node scripts/build-migration-replay-workspace.mjs --out "${{ runner.temp }}/migration-replay"
      - name: Start isolated Supabase (normalized replay workspace)
        run: supabase start --workdir "${{ runner.temp }}/migration-replay" --exclude studio,imgproxy,logflare,edge-runtime
      - name: Rebuild database from repository migrations and synthetic seed (normalized replay workspace)
        run: supabase db reset --local --workdir "${{ runner.temp }}/migration-replay"
      - name: Export isolated Supabase test credentials
        # `supabase status --output env` prints shell-quoted KEY="value" lines
        # (meant to be `source`d/`eval`ed); $GITHUB_ENV's simple KEY=value
        # parser takes everything after `=` literally, so appending the raw
        # output makes every value include its literal wrapping quotes (e.g.
        # SUPABASE_URL becomes the literal string `"http://127.0.0.1:54321"`
        # (quote characters included), which the Supabase Python client then
        # rejects as an invalid URL.
        # Strip the wrapping quotes before appending.
        run: supabase status --workdir "${{ runner.temp }}/migration-replay" --output env | sed -E 's/^([A-Z_]+)="(.*)"$/\1=\2/' >> "$GITHUB_ENV"
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install --yes postgresql-client
      - name: Verify high-impact schema contracts, RLS, extensions, and RPCs
        run: psql --set ON_ERROR_STOP=1 "postgresql://postgres:postgres@127.0.0.1:54322/postgres" --file scripts/schema-contracts.sql
      - name: Verify API schema compatibility against the migrated Supabase API
        run: |
          cd apps/api
          pip install -r requirements.txt
          python -m pytest tests/integration/ -v --tb=short
        env:
          MIGRATED_DATABASE_TEST: "1"
          SUPABASE_URL: ${{ env.API_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ env.SERVICE_ROLE_KEY }}
          SUPABASE_JWT_SECRET: "test-jwt-secret-minimum-32-characters-long!!"
          OPENAI_API_KEY: "test-key"
          ANTHROPIC_API_KEY: "test-key"
          STRIPE_SECRET_KEY: "sk_test_placeholder"
          STRIPE_WEBHOOK_SECRET: "stripe-webhook-secret-test"
          CRON_SECRET: "test-cron-secret"
          APP_ENV: "test"
          APP_URL: "http://localhost:3000"
          API_URL: "http://localhost:8000"

  test-unit-web:
    name: Test / Web unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Install dependencies
        run: cd apps/web && npm ci
      - name: Run unit tests
        run: cd apps/web && npm run test:unit
      - name: Run feature-flag rollout script tests
        run: cd apps/web && npm run test:feature-flag-scripts

  feature-flag-registry-gate:
    name: Feature Flag Registry Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Check backend/frontend registry parity
        run: node scripts/check-feature-flag-registry.mjs
      - name: Run registry parity script tests
        run: node --test scripts/check-feature-flag-registry.test.mjs

  frozen-guard:
    name: Frozen-File Guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Install dependencies
        run: cd apps/web && npm ci
      - name: Check frozen files
        run: cd apps/web && npm run check:frozen-files

  contrast:
    name: Dark-Mode Contrast Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Install dependencies
        run: cd apps/web && npm ci
      - name: Check contrast
        run: cd apps/web && npm run check:contrast

  i18n-parity:
    name: EN/ES i18n Parity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Install dependencies
        run: cd apps/web && npm ci
      - name: Check i18n key parity
        run: cd apps/web && npm run check:i18n-parity
      - name: Verify i18n gate
        run: cd apps/web && npm run verify:i18n-gate
      - name: Check floor-copy i18n
        run: cd apps/web && npm run check:floor-copy

  room-board-regression:
    name: Room-Board Pixel-Diff Regression
    runs-on: ubuntu-latest
    # Pinned Playwright container (matches the exact image the -linux.png
    # baselines were generated with) instead of the bare ubuntu-latest runner.
    # maxDiffPixelRatio is 0 (byte-identical) by design (FOUND-03) — bare
    # GitHub-hosted runners showed real, reproducible ~1% pixel drift between
    # different runner instances of the nominally-same OS image (font/Skia
    # software-rasterizer variance), which a strict 0-tolerance diff cannot
    # absorb. Running inside this container pins the whole OS/font/library
    # stack so the job's own rendering is deterministic run-to-run, not just
    # the browser version.
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble
    needs: build-web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: apps/web/package-lock.json
      - name: Install dependencies
        run: cd apps/web && npm ci
      # The image's bundled browser build only matches whatever @playwright/test
      # patch version happened to be current when the image tag was built. A
      # routine dependency bump (e.g. Dependabot) can drift past that silently
      # ("Executable doesn't exist at .../chromium_headless_shell-XXXX"), so
      # install the browser build that matches the exact installed package
      # version rather than assuming the image already has it.
      - name: Install matching Playwright browser build
        run: cd apps/web && npx playwright install chromium
      # FOUND-03 exit gate: diffs the 3 excluded Room Board surfaces against
      # the committed baseline for the never-operated regression fixture
      # tenant. Requires REGRESSION_GM_EMAIL, REGRESSION_GM_PASSWORD,
      # REGRESSION_SUP_EMAIL, REGRESSION_SUP_PASSWORD, and PLAYWRIGHT_BASE_URL
      # configured as repo secrets — globalSetup fails loudly (not a silent
      # skip) if any fixture credential is missing.
      - name: Run Room-Board regression
        run: cd apps/web && npx playwright test --config=playwright.regression.config.ts
        env:
          REGRESSION_GM_EMAIL: ${{ secrets.REGRESSION_GM_EMAIL }}
          REGRESSION_GM_PASSWORD: ${{ secrets.REGRESSION_GM_PASSWORD }}
          REGRESSION_SUP_EMAIL: ${{ secrets.REGRESSION_SUP_EMAIL }}
          REGRESSION_SUP_PASSWORD: ${{ secrets.REGRESSION_SUP_PASSWORD }}
          PLAYWRIGHT_BASE_URL: ${{ secrets.PLAYWRIGHT_BASE_URL }}
      - name: Upload diff artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: room-board-regression-diffs
          path: apps/web/test-results/
          if-no-files-found: ignore
          retention-days: 7

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Scan Python deps
        run: |
          pip install pip-audit
          cd apps/api && pip-audit -r requirements.txt --ignore-vuln PYSEC-2026-1325
        continue-on-error: true
      - name: Install web deps
        run: cd apps/web && npm ci
      - name: Scan Node deps
        run: cd apps/web && npm audit --audit-level=high
        continue-on-error: true

  release-workflow-contract:
    name: Release Workflow Contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Verify release workflow contracts
        run: node --test scripts/staging-candidate-workflow.test.mjs scripts/claude-release-engineer-workflow.test.mjs scripts/resolve-release-engineer-context.test.mjs scripts/production-monitor-smoke.test.mjs scripts/recovery-lineage-resolver.test.mjs scripts/publish-release-engineer-repair.test.mjs scripts/release-engineer-auto-merge-policy.test.mjs scripts/release-engineer-auto-merge-workflow.test.mjs scripts/public-smoke.test.mjs scripts/production-release-request-policy.test.mjs scripts/production-release-request-workflow.test.mjs scripts/production-runtime-identity.test.mjs scripts/production-release-request-cli.test.mjs scripts/check-db-drift.test.mjs scripts/audit-production-migration-evidence.test.mjs scripts/production-migration-reconciliation.test.mjs

  ci-gate:
    name: CI Gate
    runs-on: ubuntu-latest
    if: ${{ always() }}
    needs:
      - lint-api
      - lint-web
      - build-web
      - test-web-public-smoke
      - test-api
      - database-migration-gate
      - test-unit-web
      - feature-flag-registry-gate
      - frozen-guard
      - contrast
      - i18n-parity
      - room-board-regression
      - release-workflow-contract
    steps:
      - name: Require every release check to succeed
        env:
          LINT_API: ${{ needs.lint-api.result }}
          LINT_WEB: ${{ needs.lint-web.result }}
          BUILD_WEB: ${{ needs.build-web.result }}
          TEST_WEB_PUBLIC_SMOKE: ${{ needs.test-web-public-smoke.result }}
          TEST_API: ${{ needs.test-api.result }}
          DATABASE_MIGRATION_GATE: ${{ needs.database-migration-gate.result }}
          TEST_UNIT_WEB: ${{ needs.test-unit-web.result }}
          FEATURE_FLAG_REGISTRY_GATE: ${{ needs.feature-flag-registry-gate.result }}
          FROZEN_GUARD: ${{ needs.frozen-guard.result }}
          CONTRAST: ${{ needs.contrast.result }}
          I18N_PARITY: ${{ needs.i18n-parity.result }}
          ROOM_BOARD_REGRESSION: ${{ needs.room-board-regression.result }}
          RELEASE_WORKFLOW_CONTRACT: ${{ needs.release-workflow-contract.result }}
        run: |
          required_checks=(
            "Lint / API:$LINT_API"
            "Lint + Type-check / Web:$LINT_WEB"
            "Build / Web:$BUILD_WEB"
            "Test / Web public smoke:$TEST_WEB_PUBLIC_SMOKE"
            "Test / API:$TEST_API"
            "Database Migration Gate:$DATABASE_MIGRATION_GATE"
            "Test / Web unit:$TEST_UNIT_WEB"
            "Feature Flag Registry Gate:$FEATURE_FLAG_REGISTRY_GATE"
            "Frozen-File Guard:$FROZEN_GUARD"
            "Dark-Mode Contrast Gate:$CONTRAST"
            "EN/ES i18n Parity:$I18N_PARITY"
            "Room-Board Pixel-Diff Regression:$ROOM_BOARD_REGRESSION"
            "Release Workflow Contract:$RELEASE_WORKFLOW_CONTRACT"
          )

          failed=0
          for check in "${required_checks[@]}"; do
            name="${check%:*}"
            result="${check##*:}"
            if [ "$result" != "success" ]; then
              echo "::error::$name completed with '$result'; CI Gate requires success."
              failed=1
            fi
          done

          exit "$failed"

  pr-comment:
    name: PR Status
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    needs: [lint-api, lint-web, build-web, test-web-public-smoke, test-api, database-migration-gate, security, test-unit-web, feature-flag-registry-gate, frozen-guard, contrast, i18n-parity, room-board-regression]
    permissions:
      pull-requests: write
    steps:
      - uses: actions/github-script@v9
        with:
          script: |
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const bot = comments.find(c => c.user.type === 'Bot' && c.body.includes('## CI'));
            const body = [
              '## CI ✅ — All checks passed',
              '',
              '| Check | Status |',
              '|-------|--------|',
              '| API lint | ✅ |',
              '| Web lint + type-check | ✅ |',
              '| Web build | ✅ |',
              '| API smoke tests | ✅ |',
              '| Database migration gate | ✅ |',
              '| Security scan (advisory) | Completed |',
              '| Web unit tests | ✅ |',
              '| Feature flag registry gate | ✅ |',
              '| Frozen-file guard | ✅ |',
              '| Dark-mode contrast | ✅ |',
              '| EN/ES i18n parity | ✅ |',
              '| Room-Board regression | ✅ |',
            ].join('\n');
            if (bot) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: bot.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
