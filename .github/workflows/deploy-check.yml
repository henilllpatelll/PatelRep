name: Deploy Health Check

on:
  push:
    branches: [main]
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

jobs:
  floor-copy:
    name: Floor copy translation guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - run: npm ci
        working-directory: apps/web
      - run: npm run check:floor-copy
        working-directory: apps/web

  public-smoke:
    name: Public smoke verification
    runs-on: ubuntu-latest
    needs: [check-api, check-web, floor-copy]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Verify public web and API/database readiness
        run: node scripts/public-smoke.mjs
        env:
          PUBLIC_WEB_URL: https://patelrep-production-4e7f.up.railway.app
          PUBLIC_API_URL: https://stellar-integrity-production-30cf.up.railway.app

  check-api:
    name: API health
    runs-on: ubuntu-latest
    steps:
      - name: Poll API /health (up to 5 min)
        run: |
          for i in $(seq 1 10); do
            STATUS=$(curl -sf -o /dev/null -w "%{http_code}" https://stellar-integrity-production-30cf.up.railway.app/health || echo "000")
            echo "Attempt $i — HTTP $STATUS"
            if [ "$STATUS" = "200" ]; then
              echo "API is healthy"
              exit 0
            fi
            sleep 30
          done
          echo "::warning::API health check timed out — Railway deploy may still be in progress"

  check-web:
    name: Web health
    runs-on: ubuntu-latest
    steps:
      - name: Poll web app (up to 3 min)
        run: |
          for i in $(seq 1 6); do
            STATUS=$(curl -sf -o /dev/null -w "%{http_code}" -L https://patelrep-production-4e7f.up.railway.app || echo "000")
            echo "Attempt $i — HTTP $STATUS"
            if [ "$STATUS" = "200" ]; then
              echo "Web is healthy"
              exit 0
            fi
            sleep 30
          done
          echo "::warning::Web health check timed out — Railway deploy may still be in progress"
