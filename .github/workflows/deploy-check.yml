name: Deploy Health Check

on:
  push:
    branches: [main]
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

jobs:
  public-smoke:
    name: Public smoke verification
    runs-on: ubuntu-latest
    needs: [check-api, check-web]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Verify public web and API/database readiness
        run: node scripts/public-smoke.mjs
        env:
          PUBLIC_WEB_URL: https://patelrep-production-0ad1.up.railway.app
          PUBLIC_API_URL: https://stellar-integrity-production-f507.up.railway.app

  check-api:
    name: API health
    runs-on: ubuntu-latest
    steps:
      - name: Poll API /health (up to 5 min)
        run: |
          for i in $(seq 1 10); do
            STATUS=$(curl -sf -o /dev/null -w "%{http_code}" https://stellar-integrity-production-f507.up.railway.app/health || echo "000")
            echo "Attempt $i — HTTP $STATUS"
            if [ "$STATUS" = "200" ]; then
              echo "API is healthy"
              exit 0
            fi
            sleep 30
          done
          echo "::warning::API health check timed out — Railway deploy may still be in progress"

  check-web:
    name: Web health
    runs-on: ubuntu-latest
    steps:
      - name: Poll web app (up to 3 min)
        run: |
          for i in $(seq 1 6); do
            STATUS=$(curl -sf -o /dev/null -w "%{http_code}" -L https://patelrep-production-0ad1.up.railway.app || echo "000")
            echo "Attempt $i — HTTP $STATUS"
            if [ "$STATUS" = "200" ]; then
              echo "Web is healthy"
              exit 0
            fi
            sleep 30
          done
          echo "::warning::Web health check timed out — Railway deploy may still be in progress"
