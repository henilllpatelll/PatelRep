name: Deploy Health Check

# Heartbeat reliability: GitHub delivers `schedule` events best-effort (observed ~3-7h gaps against this
# */15 cron, while the Production Automation Watchdog requires a run at least every 45 minutes). The cron
# is therefore only a revival trigger (offset off the congested :00/:15 marks); the steady cadence comes
# from a relay: after every run, `relay` dispatches the next one, which waits `pace_seconds` at its start
# (so completion time stays an honest "checks finished" time). Dispatching uses GITHUB_TOKEN, adds no
# secret, service or cost, and only the relay job holds write access to Actions. One run at a time (concurrency);
# push/cron/relay triggers merge into a single pending slot instead of piling up.
# The relay never fails a health run and never affects its conclusion.

on:
  push:
    branches: [main]
  schedule:
    - cron: '4,19,34,49 * * * *'
  workflow_dispatch:
    inputs:
      pace_seconds:
        description: 'Relay use: seconds to wait (max 900) before checking, to keep a steady cadence. Leave 0 for an immediate manual run.'
        required: false
        default: '0'
        type: string

concurrency:
  group: deploy-health-check
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  pace:
    name: Relay pacing
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: scripts/deploy-check-relay.mjs
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - run: node scripts/deploy-check-relay.mjs pace
        env:
          PACE_SECONDS: ${{ inputs.pace_seconds }}

  public-smoke:
    name: Public smoke verification
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [check-api, check-web]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      # Runtime monitor of the deployed contract (explicit legacy/modern families, fail closed);
      # Production Release keeps its own strict release-verification smoke.
      - name: Verify the deployed production contract
        run: node scripts/production-monitor-smoke.mjs
        env:
          PUBLIC_WEB_URL: https://patelrep-production-6f35.up.railway.app
          PUBLIC_API_URL: https://noble-cooperation-production.up.railway.app

  check-api:
    name: API health
    runs-on: ubuntu-latest
    timeout-minutes: 8
    needs: [pace]
    steps:
      - name: Poll API /health (up to 5 min)
        run: |
          for i in $(seq 1 10); do
            STATUS=$(curl -sf -o /dev/null -w "%{http_code}" https://noble-cooperation-production.up.railway.app/health || echo "000")
            echo "Attempt $i — HTTP $STATUS"
            if [ "$STATUS" = "200" ]; then
              echo "API is healthy"
              exit 0
            fi
            sleep 30
          done
          echo "::error::API health check failed after all retries — production API is unavailable or a deploy is stuck"
          exit 1

  check-web:
    name: Web health
    runs-on: ubuntu-latest
    timeout-minutes: 6
    needs: [pace]
    steps:
      - name: Poll web app (up to 3 min)
        run: |
          for i in $(seq 1 6); do
            STATUS=$(curl -sf -o /dev/null -w "%{http_code}" -L https://patelrep-production-6f35.up.railway.app || echo "000")
            echo "Attempt $i — HTTP $STATUS"
            if [ "$STATUS" = "200" ]; then
              echo "Web is healthy"
              exit 0
            fi
            sleep 30
          done
          echo "::error::Web health check failed after all retries — production web is unavailable or a deploy is stuck"
          exit 1

  deployment-drift-check:
    name: Deployment API-URL drift check
    # HTTP 200 on the HTML shell doesn't prove NEXT_PUBLIC_API_URL points at a live backend (bug-1071) — this checks the real client-side health fetch instead.
    # Depends on check-api/check-web so a fresh push's Railway build has a chance to finish
    # rolling out before this runs -- this job has no retry of its own (unlike check-api/
    # check-web), so it previously raced a same-push Railway redeploy and hit the still-live
    # OLD container (stale CSP/API-URL) before the swap completed.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [check-api, check-web]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - run: npm ci
        working-directory: apps/web
      - run: npx playwright install --with-deps chromium
        working-directory: apps/web
      - name: Check every deployed frontend has a live API connection
        run: |
          for i in $(seq 1 5); do
            if npm run check:deployment-drift; then exit 0; fi
            echo "Attempt $i failed, retrying in 20s (Railway deploy may still be rolling out)..."
            sleep 20
          done
          exit 1
        working-directory: apps/web
        env:
          # patelrep-web.vercel.app deliberately excluded: its NEXT_PUBLIC_API_URL is
          # stale (still points at the retired 3rd Railway account) and there is no
          # available credential (MCP tool or authenticated Vercel CLI) to fix it from
          # here -- needs a manual update in the Vercel dashboard. See
          # reference_vercel_deployment memory.
          DEPLOYMENT_TARGETS: >-
            https://patelrep-production-6f35.up.railway.app

  relay:
    name: Schedule next health check
    # Runs after every outcome (a failing production still needs the next check) except cancellation.
    # Its own failure is swallowed by the script: it must not change the health result.
    if: ${{ !cancelled() }}
    needs: [pace, check-api, check-web, public-smoke, deployment-drift-check]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          sparse-checkout: scripts/deploy-check-relay.mjs
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - run: node scripts/deploy-check-relay.mjs relay
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
