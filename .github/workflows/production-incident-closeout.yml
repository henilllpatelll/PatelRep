name: Production Incident Closeout

# Phase 4B: explicit, owner-only closeout for an active automatic-rollback quarantine.
# This workflow is read-only. It does not deploy, migrate, roll back, create releases, change variables,
# or grant production authority. Its only output is an immutable sanitized artifact authorizing one exact
# fixed main SHA for a later MANUAL Production Release.
run-name: Production Incident Closeout rollback ${{ inputs.rollback_run_id }} -> ${{ inputs.reentry_sha }}

on:
  workflow_dispatch:
    inputs:
      rollback_run_id:
        description: "Successful automated Production Rollback run id to close out"
        required: true
        type: string
      reentry_sha:
        description: "Exact current main SHA containing the reviewed fix; must already have a successful CI Gate"
        required: true
        type: string

concurrency:
  group: production-incident-closeout
  cancel-in-progress: false

permissions:
  contents: read
  actions: read
  checks: read

jobs:
  closeout:
    name: Approve exact incident re-entry SHA
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          sparse-checkout: scripts
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Validate active quarantine and bind exact fixed main SHA
        run: |
          test "$GITHUB_REF" = refs/heads/main
          node scripts/production-incident-closeout.mjs closeout
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
          ACTOR: ${{ github.actor }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          CONTROL_PLANE_SHA: ${{ github.sha }}
          ROLLBACK_RUN_ID: ${{ inputs.rollback_run_id }}
          REENTRY_SHA: ${{ inputs.reentry_sha }}
          RESULT_DIR: ${{ runner.temp }}/production-incident-closeout
      - name: Upload sanitized incident closeout
        uses: actions/upload-artifact@v4
        with:
          name: production-incident-closeout
          path: ${{ runner.temp }}/production-incident-closeout/context.json
          retention-days: 90
          if-no-files-found: error
