name: Production Release

# Intentional production release: a human deliberately dispatches this after
# a PR has passed CI Gate + Staging Gate and been merged to `main`. Merging to
# `main` never deploys production by itself -- see docs/RELEASE_PROCESS.md.
#
# This workflow never accepts an arbitrary ref. It resolves either the current
# tip of `main` (default) or an explicit `release_sha` input, then REFUSES to
# proceed unless that commit: is reachable from `main`, passed `CI Gate`, and
# corresponds (by git tree identity, not commit-SHA equality -- squash merges
# change the commit SHA) to a PR head commit that passed `Staging Gate`.
#
# Deploys use the same `railway up --ci` mechanism `staging-candidate.yml`
# already proves: an exact detached-HEAD checkout built and deployed directly,
# independent of Railway's GitHub auto-deploy trigger (which is pinned to a
# fixed commit for the two production services -- see docs/ENVIRONMENTS.md).

# Phase 2D: the Claude Release Engineer may REQUEST (dispatch) this workflow for a narrowly scoped recovery fix by
# passing `automation_source_run_id`. That never bypasses anything: the `production` Environment below scopes the
# production secrets and variables, but no separate human deployment approval is required -- this workflow itself
# enforces release eligibility and fails closed. In automated mode it independently re-verifies the whole provenance
# (scripts/production-release-request.mjs release) before any production step.
# Manual dispatches leave `automation_source_run_id` blank and keep the original semantics unchanged.

# Phase 3A adds only a sanitized evidence ledger after the release graph finishes. The ledger job has no
# production Environment or production credentials and cannot deploy, migrate, tag, release, or roll back.
#
# Phase 4B adds an unprivileged re-entry preflight before any production Environment job. Normal releases
# need no extra input. If a verified automated rollback incident is still open, automatic requests are refused
# and a manual release must pin the exact SHA + version bump authorized by Production Incident Re-entry.
# The run name carries the exact target so a duplicate automated request is deterministically detectable.
run-name: Production Release ${{ inputs.release_sha || 'main-tip' }}${{ inputs.automation_source_run_id && format(' (automated request from run {0})', inputs.automation_source_run_id) || '' }}

on:
  workflow_dispatch:
    inputs:
      release_sha:
        description: "Exact commit SHA on main to release (default: current main tip)"
        required: false
        type: string
      version_bump:
        description: Next version segment to increment
        required: true
        type: choice
        default: patch
        options: [patch, minor, major]
      automation_source_run_id:
        description: "Automation only: Auto-Merge run id of the recovery merge being released (leave blank for a manual release)"
        required: false
        type: string
      reentry_source_run_id:
        description: "Incident re-entry only: successful Production Incident Re-entry run id; otherwise leave blank"
        required: false
        type: string

concurrency:
  # Shared with production-rollback.yml so a release and a rollback can never
  # mutate production at the same time.
  group: production-deploy
  cancel-in-progress: false

permissions:
  contents: write
  actions: read
  checks: read
  pull-requests: read

jobs:
  verify-production-reentry:
    name: Verify production incident re-entry
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      checks: read
      pull-requests: read
    outputs:
      required: ${{ steps.reentry.outputs.required }}
      rollback_run_id: ${{ steps.reentry.outputs.rollback_run_id }}
      authorization_run_id: ${{ steps.reentry.outputs.authorization_run_id }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          sparse-checkout: scripts
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - id: reentry
        name: Refuse unresolved rollback re-entry without exact human authorization
        run: |
          test "$GITHUB_REF" = refs/heads/main
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          node scripts/production-incident-reentry.mjs release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RELEASE_SHA: ${{ inputs.release_sha }}
          VERSION_BUMP: ${{ inputs.version_bump }}
          REENTRY_SOURCE_RUN_ID: ${{ inputs.reentry_source_run_id }}
          AUTOMATION_SOURCE_RUN_ID: ${{ inputs.automation_source_run_id }}

  resolve-and-verify-eligibility:
    name: Resolve and verify release eligibility
    needs: verify-production-reentry
    runs-on: ubuntu-latest
    environment: production
    outputs:
      eligible: ${{ steps.resolve.outputs.eligible }}
      target_sha: ${{ steps.resolve.outputs.target_sha }}
      short_sha: ${{ steps.resolve.outputs.short_sha }}
      pr_number: ${{ steps.resolve.outputs.pr_number }}
      reason: ${{ steps.resolve.outputs.reason }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        if: inputs.automation_source_run_id != ''
        with:
          node-version: '22'
      # Automated-request mode only: runs before anything else in the `production` Environment job (no human
      # approval pause precedes it). Re-derives the whole request provenance from fresh GitHub state; any refusal fails the release.
      - name: Verify automated request provenance
        if: inputs.automation_source_run_id != ''
        run: |
          test "$GITHUB_REF" = refs/heads/main
          node scripts/production-release-request.mjs release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SOURCE_RUN_ID: ${{ inputs.automation_source_run_id }}
          RELEASE_SHA: ${{ inputs.release_sha }}
          VERSION_BUMP: ${{ inputs.version_bump }}
          PRODUCTION_AUTO_RELEASE_ENABLED: ${{ vars.PRODUCTION_AUTO_RELEASE_ENABLED }}
      - id: resolve
        uses: actions/github-script@v8
        env:
          RELEASE_CONTEXT_DIR: ${{ runner.temp }}/production-release-context
        with:
          script: |
            const requestedSha = context.payload.inputs.release_sha?.trim()
            const main = await github.rest.repos.getBranch({ ...context.repo, branch: 'main' })
            const currentMainSha = main.data.commit.sha
            const targetSha = requestedSha || currentMainSha

            // Identifier-only handoff for the Claude release engineer (release_sha may differ from
            // the run's head_sha). Written before any check so it exists even when eligibility fails.
            const fs = require('fs')
            const writeReleaseContext = (prNumber) => {
              fs.mkdirSync(process.env.RELEASE_CONTEXT_DIR, { recursive: true })
              fs.writeFileSync(
                `${process.env.RELEASE_CONTEXT_DIR}/context.json`,
                JSON.stringify({ release_sha: targetSha, pr_number: prNumber }),
              )
            }
            writeReleaseContext('')

            core.info(`Resolved target: ${targetSha}`)
            core.info(`Current main tip: ${currentMainSha}`)
            if (requestedSha && requestedSha !== currentMainSha) {
              core.warning(`Releasing explicit SHA ${requestedSha}, which is not main's current tip ${currentMainSha}. Proceeding with the explicitly approved target only.`)
            }

            const fail = (reason) => {
              core.setFailed(reason)
              core.setOutput('eligible', 'false')
              core.setOutput('reason', reason)
            }

            // 1. Must be a real, known commit.
            let targetCommit
            try {
              targetCommit = await github.rest.repos.getCommit({ ...context.repo, ref: targetSha })
            } catch {
              return fail(`Target SHA ${targetSha} is not a known commit in this repository.`)
            }

            // 2. Must be reachable from main (compare base=target, head=main).
            const compare = await github.rest.repos.compareCommitsWithBasehead({
              ...context.repo, basehead: `${targetSha}...${currentMainSha}`,
            })
            if (!['identical', 'ahead'].includes(compare.data.status)) {
              return fail(`Target SHA ${targetSha} is not an ancestor of main (status: ${compare.data.status}).`)
            }

            // 3. Must have a successful CI Gate.
            // Paginate: a commit can carry more than 100 check runs.
            const checkRuns = await github.paginate(github.rest.checks.listForRef, { ...context.repo, ref: targetSha, per_page: 100 })
            if (!checkRuns.some((c) => c.name === 'CI Gate' && c.conclusion === 'success')) {
              return fail(`Target SHA ${targetSha} does not have a successful CI Gate check.`)
            }

            // 4. Find the merged PR associated with this commit (works for squash merges).
            const prs = await github.rest.repos.listPullRequestsAssociatedWithCommit({ ...context.repo, commit_sha: targetSha })
            const mergedPr = prs.data.find((pr) => pr.merged_at && pr.base.ref === 'main')
            if (!mergedPr) {
              return fail(`No merged PR targeting main is associated with ${targetSha}. Cannot verify it was staging-tested.`)
            }

            // 5. That PR's head commit (pre-merge) must have passed Staging Gate.
            const prHeadSha = mergedPr.head.sha
            const prCheckRuns = await github.paginate(github.rest.checks.listForRef, { ...context.repo, ref: prHeadSha, per_page: 100 })
            if (!prCheckRuns.some((c) => c.name === 'Staging Gate' && c.conclusion === 'success')) {
              return fail(`PR #${mergedPr.number}'s head commit ${prHeadSha} does not have a successful Staging Gate check. This release has not been staging-verified.`)
            }

            // 6. Tree identity: the merged main commit's tree must match the
            // staged PR head's tree. A plain squash merge of an up-to-date
            // branch produces the same tree; this check proves it rather than
            // assuming it.
            const prHeadCommit = await github.rest.git.getCommit({ ...context.repo, commit_sha: prHeadSha })
            if (targetCommit.data.commit.tree.sha !== prHeadCommit.data.tree.sha) {
              return fail(`Target ${targetSha}'s tree does not match staging-verified PR #${mergedPr.number} head ${prHeadSha}'s tree. The merged result differs from what passed Staging Gate.`)
            }

            writeReleaseContext(String(mergedPr.number))
            core.setOutput('eligible', 'true')
            core.setOutput('target_sha', targetSha)
            core.setOutput('short_sha', targetSha.slice(0, 7))
            core.setOutput('pr_number', String(mergedPr.number))
            core.info(`Eligible: PR #${mergedPr.number} (head ${prHeadSha}) passed Staging Gate and its tree matches ${targetSha}.`)
      - name: Upload sanitized release context
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-release-context
          path: ${{ runner.temp }}/production-release-context/context.json
          retention-days: 3
          if-no-files-found: ignore

  compute-version:
    name: Compute next release version
    needs: resolve-and-verify-eligibility
    if: needs.resolve-and-verify-eligibility.outputs.eligible == 'true'
    runs-on: ubuntu-latest
    outputs:
      next_version: ${{ steps.version.outputs.next }}
      previous_tag: ${{ steps.version.outputs.previous }}
    steps:
      # Versioning code comes from the workflow's own commit (never the possibly older release target) and the
      # previous version from COMPLETED GitHub Releases, not arbitrary tags (see docs/RELEASE_PROCESS.md).
      - uses: actions/checkout@v7
        with:
          sparse-checkout: scripts
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Compute next version from the previous completed production release
        id: version
        run: node scripts/release-version.mjs
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BUMP: ${{ inputs.version_bump }}

  release-content-summary:
    name: Release content summary
    needs: [resolve-and-verify-eligibility, compute-version]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve-and-verify-eligibility.outputs.target_sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Build and post release content summary
        run: |
          {
            echo "## Candidate release: ${{ needs.compute-version.outputs.next_version }} (pending verification)"
            node scripts/release-content-summary.mjs
          } | tee -a "$GITHUB_STEP_SUMMARY"

  production-db-preflight:
    name: Production database pre-flight
    needs: resolve-and-verify-eligibility
    if: needs.resolve-and-verify-eligibility.outputs.eligible == 'true'
    runs-on: ubuntu-latest
    environment: production
    outputs:
      pending: ${{ steps.drift.outputs.pending }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve-and-verify-eligibility.outputs.target_sha }}
          fetch-depth: 1
      - name: Prove exact release checkout
        run: git checkout --detach "${{ needs.resolve-and-verify-eligibility.outputs.target_sha }}" && test "$(git rev-parse HEAD)" = "${{ needs.resolve-and-verify-eligibility.outputs.target_sha }}"
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - uses: supabase/setup-cli@v1
        with:
          version: 2.112.0
      - name: Confirm migration history is safe to release
        run: node scripts/check-migrations.mjs
      - name: Refuse any non-production database target
        run: node scripts/production-target-guard.mjs
        env:
          PRODUCTION_SUPABASE_DB_URL: ${{ secrets.PRODUCTION_SUPABASE_DB_URL }}
          PRODUCTION_SUPABASE_URL: ${{ vars.PRODUCTION_SUPABASE_URL }}
          PRODUCTION_EXPECTED_DATABASE_HOST: ${{ vars.PRODUCTION_EXPECTED_DATABASE_HOST }}
          PRODUCTION_EXPECTED_SUPABASE_HOST: ${{ vars.PRODUCTION_SUPABASE_HOST }}
          STAGING_DATABASE_HOST: ${{ vars.STAGING_DATABASE_HOST }}
          STAGING_SUPABASE_HOST: ${{ vars.STAGING_SUPABASE_HOST }}
      - name: Install PostgreSQL client for read-only migration verification
        run: sudo apt-get update && sudo apt-get install --yes postgresql-client
      - name: Show pending production migrations (list-only, no apply)
        id: drift
        run: |
          set +e
          set -o pipefail
          node scripts/check-db-drift.mjs --environment production --allow-pending | tee drift.txt
          status=$?
          set +o pipefail
          set -e
          if grep -q "Unknown on production" drift.txt; then
            echo "::error::Unexpected migrations found on production that are not in this repository. STOPPING -- this requires manual investigation, never automatic repair."
            exit 1
          fi
          if grep -q "^Status: CLEAN" drift.txt; then
            echo "pending=false" >> "$GITHUB_OUTPUT"
          else
            echo "pending=true" >> "$GITHUB_OUTPUT"
          fi
          exit "$status"
        env:
          PRODUCTION_SUPABASE_DB_URL: ${{ secrets.PRODUCTION_SUPABASE_DB_URL }}
      - name: Prove the ephemeral apply workspace and Supabase CLI plan (dry run, no apply)
        if: steps.drift.outputs.pending == 'true'
        run: node scripts/production-migration-apply-workspace.mjs plan
        env:
          PRODUCTION_SUPABASE_DB_URL: ${{ secrets.PRODUCTION_SUPABASE_DB_URL }}
          PRODUCTION_SUPABASE_URL: ${{ vars.PRODUCTION_SUPABASE_URL }}
          PRODUCTION_EXPECTED_DATABASE_HOST: ${{ vars.PRODUCTION_EXPECTED_DATABASE_HOST }}
          PRODUCTION_EXPECTED_SUPABASE_HOST: ${{ vars.PRODUCTION_SUPABASE_HOST }}
          STAGING_DATABASE_HOST: ${{ vars.STAGING_DATABASE_HOST }}
          STAGING_SUPABASE_HOST: ${{ vars.STAGING_SUPABASE_HOST }}

  production-db-migrate:
    name: Apply production migrations
    needs: [resolve-and-verify-eligibility, production-db-preflight]
    if: needs.production-db-preflight.outputs.pending == 'true'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve-and-verify-eligibility.outputs.target_sha }}
          fetch-depth: 1
      - name: Prove exact release checkout
        run: git checkout --detach "${{ needs.resolve-and-verify-eligibility.outputs.target_sha }}" && test "$(git rev-parse HEAD)" = "${{ needs.resolve-and-verify-eligibility.outputs.target_sha }}"
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - uses: supabase/setup-cli@v1
        with:
          version: 2.112.0
      - name: Refuse any non-production database target
        run: node scripts/production-target-guard.mjs
        env:
          PRODUCTION_SUPABASE_DB_URL: ${{ secrets.PRODUCTION_SUPABASE_DB_URL }}
          PRODUCTION_SUPABASE_URL: ${{ vars.PRODUCTION_SUPABASE_URL }}
          PRODUCTION_EXPECTED_DATABASE_HOST: ${{ vars.PRODUCTION_EXPECTED_DATABASE_HOST }}
          PRODUCTION_EXPECTED_SUPABASE_HOST: ${{ vars.PRODUCTION_SUPABASE_HOST }}
          STAGING_DATABASE_HOST: ${{ vars.STAGING_DATABASE_HOST }}
          STAGING_SUPABASE_HOST: ${{ vars.STAGING_SUPABASE_HOST }}
      - name: Install PostgreSQL client for migration verification
        run: sudo apt-get update && sudo apt-get install --yes postgresql-client
      - name: Apply verified pending migrations through the ephemeral production workspace
        run: node scripts/production-migration-apply-workspace.mjs apply
        env:
          PRODUCTION_SUPABASE_DB_URL: ${{ secrets.PRODUCTION_SUPABASE_DB_URL }}
          PRODUCTION_SUPABASE_URL: ${{ vars.PRODUCTION_SUPABASE_URL }}
          PRODUCTION_EXPECTED_DATABASE_HOST: ${{ vars.PRODUCTION_EXPECTED_DATABASE_HOST }}
          PRODUCTION_EXPECTED_SUPABASE_HOST: ${{ vars.PRODUCTION_SUPABASE_HOST }}
          STAGING_DATABASE_HOST: ${{ vars.STAGING_DATABASE_HOST }}
          STAGING_SUPABASE_HOST: ${{ vars.STAGING_SUPABASE_HOST }}
      - name: Verify production migration identifiers are clean
        run: node scripts/check-db-drift.mjs --environment production
        env:
          PRODUCTION_SUPABASE_DB_URL: ${{ secrets.PRODUCTION_SUPABASE_DB_URL }}
      - name: Verify attestations, forward repairs and duplicate coverage after apply
        run: node scripts/production-migration-apply-workspace.mjs verify-applied
        env:
          PRODUCTION_SUPABASE_DB_URL: ${{ secrets.PRODUCTION_SUPABASE_DB_URL }}
          PRODUCTION_SUPABASE_URL: ${{ vars.PRODUCTION_SUPABASE_URL }}
          PRODUCTION_EXPECTED_DATABASE_HOST: ${{ vars.PRODUCTION_EXPECTED_DATABASE_HOST }}
          PRODUCTION_EXPECTED_SUPABASE_HOST: ${{ vars.PRODUCTION_SUPABASE_HOST }}
          STAGING_DATABASE_HOST: ${{ vars.STAGING_DATABASE_HOST }}
          STAGING_SUPABASE_HOST: ${{ vars.STAGING_SUPABASE_HOST }}
      - name: Verify production schema contracts
        run: psql --set ON_ERROR_STOP=1 "$PRODUCTION_SUPABASE_DB_URL" --file scripts/schema-contracts.sql
        env:
          PRODUCTION_SUPABASE_DB_URL: ${{ secrets.PRODUCTION_SUPABASE_DB_URL }}

  deploy-api:
    name: Deploy exact API release
    needs: [resolve-and-verify-eligibility, compute-version, production-db-preflight, production-db-migrate]
    if: ${{ !cancelled() && needs.resolve-and-verify-eligibility.outputs.eligible == 'true' && needs.compute-version.result == 'success' && needs.production-db-preflight.result == 'success' && (needs.production-db-migrate.result == 'success' || needs.production-db-migrate.result == 'skipped') }}
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve-and-verify-eligibility.outputs.target_sha }}
          fetch-depth: 1
      - name: Prove exact release checkout
        run: git checkout --detach "${{ needs.resolve-and-verify-eligibility.outputs.target_sha }}" && test "$(git rev-parse HEAD)" = "${{ needs.resolve-and-verify-eligibility.outputs.target_sha }}"
      - name: Refuse a non-production Railway target
        run: |
          test "$PRODUCTION_RAILWAY_ENVIRONMENT" = production
          test -n "$PRODUCTION_RAILWAY_PROJECT_ID"
          test -n "$PRODUCTION_RAILWAY_API_SERVICE_ID"
        env:
          PRODUCTION_RAILWAY_ENVIRONMENT: ${{ vars.PRODUCTION_RAILWAY_ENVIRONMENT }}
          PRODUCTION_RAILWAY_PROJECT_ID: ${{ vars.PRODUCTION_RAILWAY_PROJECT_ID }}
          PRODUCTION_RAILWAY_API_SERVICE_ID: ${{ vars.PRODUCTION_RAILWAY_API_SERVICE_ID }}
      - name: Inject exact API release identity
        run: |
          npx --yes @railway/cli@4.30.0 link --project "$PRODUCTION_RAILWAY_PROJECT_ID" --environment production --service "$PRODUCTION_RAILWAY_API_SERVICE_ID"
          npx --yes @railway/cli@4.30.0 variables set \
            RELEASE_SHA="${{ needs.resolve-and-verify-eligibility.outputs.target_sha }}" \
            RELEASE_VERSION="${{ needs.compute-version.outputs.next_version }}" \
            APP_ENV=production \
            --environment production --service "$PRODUCTION_RAILWAY_API_SERVICE_ID" --skip-deploys
        env:
          RAILWAY_API_TOKEN: ${{ secrets.PRODUCTION_RAILWAY_API_TOKEN }}
          PRODUCTION_RAILWAY_PROJECT_ID: ${{ vars.PRODUCTION_RAILWAY_PROJECT_ID }}
          PRODUCTION_RAILWAY_API_SERVICE_ID: ${{ vars.PRODUCTION_RAILWAY_API_SERVICE_ID }}
      - name: Deploy API from exact checkout
        run: npx --yes @railway/cli@4.30.0 up --ci --project "$PRODUCTION_RAILWAY_PROJECT_ID" --environment production --service "$PRODUCTION_RAILWAY_API_SERVICE_ID"
        env:
          RAILWAY_API_TOKEN: ${{ secrets.PRODUCTION_RAILWAY_API_TOKEN }}
          PRODUCTION_RAILWAY_PROJECT_ID: ${{ vars.PRODUCTION_RAILWAY_PROJECT_ID }}
          PRODUCTION_RAILWAY_API_SERVICE_ID: ${{ vars.PRODUCTION_RAILWAY_API_SERVICE_ID }}
      - name: Require API health, readiness, production database, and exact release identity (hard failure on timeout)
        run: |
          for attempt in $(seq 1 24); do
            if curl --fail --silent --show-error "${PRODUCTION_API_URL%/}/health" > health.json && curl --fail --silent --show-error "${PRODUCTION_API_URL%/}/ready" > ready.json; then
              if node -e 'const fs=require("fs"); const h=JSON.parse(fs.readFileSync("health.json")); const r=JSON.parse(fs.readFileSync("ready.json")); if(h.status!=="ok"||h.db!=="ok"||h.environment!=="production"||h.release_sha!==process.env.TARGET_SHA||h.release_version!==process.env.TARGET_VERSION||h.supabase_host!==process.env.PRODUCTION_SUPABASE_HOST||r.status!=="ready"||r.release_sha!==process.env.TARGET_SHA||r.release_version!==process.env.TARGET_VERSION) process.exit(1)'; then
                echo "API release verified healthy."
                exit 0
              fi
            fi
            echo "Attempt $attempt/24: API not yet healthy at the exact release identity, retrying in 10s..."
            sleep 10
          done
          echo "::error::API health/readiness did not confirm the exact release within the retry window. Failing the release -- production Web will NOT be deployed."
          exit 1
        env:
          PRODUCTION_API_URL: ${{ vars.PRODUCTION_API_URL }}
          PRODUCTION_SUPABASE_HOST: ${{ vars.PRODUCTION_SUPABASE_HOST }}
          TARGET_SHA: ${{ needs.resolve-and-verify-eligibility.outputs.target_sha }}
          TARGET_VERSION: ${{ needs.compute-version.outputs.next_version }}

  deploy-web:
    name: Deploy exact web release
    needs: [resolve-and-verify-eligibility, compute-version, deploy-api]
    if: ${{ !cancelled() && needs.resolve-and-verify-eligibility.result == 'success' && needs.resolve-and-verify-eligibility.outputs.eligible == 'true' && needs.compute-version.result == 'success' && needs.deploy-api.result == 'success' }}
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve-and-verify-eligibility.outputs.target_sha }}
          fetch-depth: 1
      - name: Prove exact release checkout
        run: git checkout --detach "${{ needs.resolve-and-verify-eligibility.outputs.target_sha }}" && test "$(git rev-parse HEAD)" = "${{ needs.resolve-and-verify-eligibility.outputs.target_sha }}"
      - name: Refuse a non-production Railway target
        run: |
          test "$PRODUCTION_RAILWAY_ENVIRONMENT" = production
          test -n "$PRODUCTION_RAILWAY_PROJECT_ID"
          test -n "$PRODUCTION_RAILWAY_WEB_SERVICE_ID"
        env:
          PRODUCTION_RAILWAY_ENVIRONMENT: ${{ vars.PRODUCTION_RAILWAY_ENVIRONMENT }}
          PRODUCTION_RAILWAY_PROJECT_ID: ${{ vars.PRODUCTION_RAILWAY_PROJECT_ID }}
          PRODUCTION_RAILWAY_WEB_SERVICE_ID: ${{ vars.PRODUCTION_RAILWAY_WEB_SERVICE_ID }}
      - name: Inject exact web release identity at build time
        run: |
          npx --yes @railway/cli@4.30.0 link --project "$PRODUCTION_RAILWAY_PROJECT_ID" --environment production --service "$PRODUCTION_RAILWAY_WEB_SERVICE_ID"
          npx --yes @railway/cli@4.30.0 variables set \
            NEXT_PUBLIC_RELEASE_SHA="${{ needs.resolve-and-verify-eligibility.outputs.target_sha }}" \
            NEXT_PUBLIC_RELEASE_VERSION="${{ needs.compute-version.outputs.next_version }}" \
            NEXT_PUBLIC_APP_ENV=production \
            --environment production --service "$PRODUCTION_RAILWAY_WEB_SERVICE_ID" --skip-deploys
        env:
          RAILWAY_API_TOKEN: ${{ secrets.PRODUCTION_RAILWAY_API_TOKEN }}
          PRODUCTION_RAILWAY_PROJECT_ID: ${{ vars.PRODUCTION_RAILWAY_PROJECT_ID }}
          PRODUCTION_RAILWAY_WEB_SERVICE_ID: ${{ vars.PRODUCTION_RAILWAY_WEB_SERVICE_ID }}
      - name: Deploy web from exact checkout
        run: npx --yes @railway/cli@4.30.0 up apps/web --ci --path-as-root --project "$PRODUCTION_RAILWAY_PROJECT_ID" --environment production --service "$PRODUCTION_RAILWAY_WEB_SERVICE_ID"
        env:
          RAILWAY_API_TOKEN: ${{ secrets.PRODUCTION_RAILWAY_API_TOKEN }}
          PRODUCTION_RAILWAY_PROJECT_ID: ${{ vars.PRODUCTION_RAILWAY_PROJECT_ID }}
          PRODUCTION_RAILWAY_WEB_SERVICE_ID: ${{ vars.PRODUCTION_RAILWAY_WEB_SERVICE_ID }}

  verify-production-release:
    name: Verify production release identity and smoke
    needs: [resolve-and-verify-eligibility, compute-version, deploy-api, deploy-web]
    if: ${{ !cancelled() && needs.resolve-and-verify-eligibility.result == 'success' && needs.compute-version.result == 'success' && needs.deploy-api.result == 'success' && needs.deploy-web.result == 'success' }}
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ vars.PRODUCTION_WEB_URL }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve-and-verify-eligibility.outputs.target_sha }}
          fetch-depth: 1
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      # `railway up --ci` can return while the new Web container is still activating, so the old container may
      # briefly keep serving the previous release (run 37958771273). Poll for the EXACT expected SHA/version for a
      # bounded window; a wrong environment, Supabase host, database or readiness fails immediately and a
      # timeout fails the release. Nothing about the expected identity is relaxed.
      - name: Verify Web/API agree with each other and the exact expected release
        timeout-minutes: 15
        run: node scripts/public-smoke.mjs
        env:
          SMOKE_WAIT_TIMEOUT_SECONDS: '600'
          SMOKE_WAIT_INTERVAL_SECONDS: '15'
          PUBLIC_WEB_URL: ${{ vars.PRODUCTION_WEB_URL }}
          PUBLIC_API_URL: ${{ vars.PRODUCTION_API_URL }}
          EXPECTED_APP_ENV: production
          EXPECTED_SUPABASE_HOST: ${{ vars.PRODUCTION_SUPABASE_HOST }}
          EXPECTED_RELEASE_SHA: ${{ needs.resolve-and-verify-eligibility.outputs.target_sha }}
          EXPECTED_RELEASE_VERSION: ${{ needs.compute-version.outputs.next_version }}
      - name: Verify no deployment API-URL drift
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npm run check:deployment-drift
        working-directory: apps/web
        env:
          DEPLOYMENT_TARGETS: ${{ vars.PRODUCTION_WEB_URL }}

  tag-and-release:
    name: Tag and create GitHub Release
    needs: [resolve-and-verify-eligibility, compute-version, verify-production-release]
    if: ${{ !cancelled() && needs.resolve-and-verify-eligibility.result == 'success' && needs.compute-version.result == 'success' && needs.verify-production-release.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve-and-verify-eligibility.outputs.target_sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Build release notes
        run: node scripts/release-content-summary.mjs > release-notes.md
      - name: Create annotated tag (only now that production verification has succeeded)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "$NEXT_VERSION" -m "Production release $NEXT_VERSION (${{ needs.resolve-and-verify-eligibility.outputs.short_sha }})"
          git push origin "$NEXT_VERSION"
        env:
          NEXT_VERSION: ${{ needs.compute-version.outputs.next_version }}
      - name: Create GitHub Release
        run: gh release create "$NEXT_VERSION" --title "$NEXT_VERSION" --notes-file release-notes.md
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NEXT_VERSION: ${{ needs.compute-version.outputs.next_version }}

  production-release-evidence:
    name: Production release evidence ledger
    needs:
      - verify-production-reentry
      - resolve-and-verify-eligibility
      - compute-version
      - release-content-summary
      - production-db-preflight
      - production-db-migrate
      - deploy-api
      - deploy-web
      - verify-production-release
      - tag-and-release
    if: ${{ always() }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          sparse-checkout: scripts
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Write sanitized release evidence
        run: node scripts/production-release-evidence.mjs
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          CONTROL_PLANE_SHA: ${{ github.sha }}
          VERSION_BUMP: ${{ inputs.version_bump }}
          AUTOMATION_SOURCE_RUN_ID: ${{ inputs.automation_source_run_id }}
          REENTRY_SOURCE_RUN_ID: ${{ inputs.reentry_source_run_id }}
          REENTRY_ROLLBACK_RUN_ID: ${{ needs.verify-production-reentry.outputs.rollback_run_id }}
          REENTRY_PREFLIGHT_RESULT: ${{ needs.verify-production-reentry.result }}
          ELIGIBLE: ${{ needs.resolve-and-verify-eligibility.outputs.eligible }}
          TARGET_SHA: ${{ needs.resolve-and-verify-eligibility.outputs.target_sha }}
          PR_NUMBER: ${{ needs.resolve-and-verify-eligibility.outputs.pr_number }}
          PREVIOUS_TAG: ${{ needs.compute-version.outputs.previous_tag }}
          NEXT_VERSION: ${{ needs.compute-version.outputs.next_version }}
          RESOLVE_RESULT: ${{ needs.resolve-and-verify-eligibility.result }}
          COMPUTE_VERSION_RESULT: ${{ needs.compute-version.result }}
          CONTENT_SUMMARY_RESULT: ${{ needs.release-content-summary.result }}
          DB_PREFLIGHT_RESULT: ${{ needs.production-db-preflight.result }}
          DB_PENDING: ${{ needs.production-db-preflight.outputs.pending }}
          DB_MIGRATE_RESULT: ${{ needs.production-db-migrate.result }}
          API_RESULT: ${{ needs.deploy-api.result }}
          WEB_RESULT: ${{ needs.deploy-web.result }}
          VERIFY_RESULT: ${{ needs.verify-production-release.result }}
          TAG_RESULT: ${{ needs.tag-and-release.result }}
          RESULT_DIR: ${{ runner.temp }}/production-release-evidence
      - name: Upload sanitized release evidence
        uses: actions/upload-artifact@v4
        with:
          name: production-release-evidence
          path: ${{ runner.temp }}/production-release-evidence/context.json
          retention-days: 90
          if-no-files-found: error

