name: Production Cron Jobs

# Triggers the FastAPI /internal/* cron endpoints on a schedule.
#
# WHY THIS EXISTS: the production Railway account (prishap110113@gmail.com) never had
# its native cron scheduler configured, so every job showed "stale" in /health and
# notifications.last_delivery was null — no scheduled job had ever run. These endpoints
# are plain authenticated HTTP POSTs (verify_cron checks the X-Cron-Secret header), so
# GitHub Actions can drive them. deploy-check.yml already proves Actions can reach prod.
#
# SETUP (repo owner, one time):
#   1. Add a repository secret CRON_SECRET matching the API's CRON_SECRET env var.
#   2. (Optional) Add a repository variable CRON_API_URL to override the default API URL.
#   3. Merge this workflow to the default branch — scheduled workflows only run from there.
#
# NOTE: GitHub-scheduled runs are best-effort and can lag 5-15 min under load. None of
# these jobs are hard-real-time, so that is acceptable. A non-200 response fails the run
# red, which surfaces a broken cron (e.g. 401 = secret mismatch) in the Actions tab.

on:
  schedule:
    - cron: '*/30 * * * *'    # frequent: predictions, opera sync, escalation ladder
    - cron: '0 6 * * *'       # daily 06:00 UTC: pm due, GM report, evidence + safety reminders
    - cron: '0 7,15,23 * * *' # shift-end summaries
    - cron: '0 0 * * *'       # nightly: AI asset-failure predictions
    - cron: '0 3 * * *'       # nightly: expired-logbook cleanup
    - cron: '0 0 28-31 * *'   # month-end: Stripe billing true-up
  workflow_dispatch:
    inputs:
      target:
        description: 'Which group to run manually'
        type: choice
        default: frequent
        options:
          - frequent
          - daily-6am
          - shift-summary
          - nightly
          - cleanup
          - billing   # WARNING: creates Stripe invoice items; running twice in a period may duplicate
          - all

env:
  API_URL: ${{ vars.CRON_API_URL || 'https://stellar-integrity-production-f507.up.railway.app' }}

jobs:
  frequent:
    name: Frequent (predictions, opera, escalations)
    if: github.event.schedule == '*/30 * * * *' || github.event.inputs.target == 'frequent' || github.event.inputs.target == 'all'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger frequent crons
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -uo pipefail
          fire() {
            echo "→ POST /internal/$1"
            code=$(curl -sS -o /tmp/body -w "%{http_code}" -X POST \
              -H "X-Cron-Secret: $CRON_SECRET" "$API_URL/v1/internal/$1" || echo "000")
            echo "  HTTP $code"; cat /tmp/body 2>/dev/null; echo
            [ "$code" = "200" ] || { echo "::error::/internal/$1 returned $code"; return 1; }
          }
          rc=0
          fire predictions/run || rc=1
          fire opera/sync-reservations || rc=1
          fire escalations/check || rc=1
          exit $rc

  daily-6am:
    name: Daily 06:00 (pm, reports, evidence, safety)
    if: github.event.schedule == '0 6 * * *' || github.event.inputs.target == 'daily-6am' || github.event.inputs.target == 'all'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger daily 06:00 crons
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -uo pipefail
          fire() {
            echo "→ POST /internal/$1"
            code=$(curl -sS -o /tmp/body -w "%{http_code}" -X POST \
              -H "X-Cron-Secret: $CRON_SECRET" "$API_URL/v1/internal/$1" || echo "000")
            echo "  HTTP $code"; cat /tmp/body 2>/dev/null; echo
            [ "$code" = "200" ] || { echo "::error::/internal/$1 returned $code"; return 1; }
          }
          rc=0
          fire pm/check-due || rc=1
          fire reports/daily-summary-email || rc=1
          fire evidence/reminders || rc=1
          fire safety/training-assignments || rc=1
          fire safety/drill-follow-up || rc=1
          fire lost-found/retention-check || rc=1
          exit $rc

  shift-summary:
    name: Shift-end summaries
    if: github.event.schedule == '0 7,15,23 * * *' || github.event.inputs.target == 'shift-summary' || github.event.inputs.target == 'all'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger shift summary cron
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -uo pipefail
          code=$(curl -sS -o /tmp/body -w "%{http_code}" -X POST \
            -H "X-Cron-Secret: $CRON_SECRET" "$API_URL/v1/internal/logbook/shift-summary" || echo "000")
          echo "HTTP $code"; cat /tmp/body 2>/dev/null; echo
          [ "$code" = "200" ] || { echo "::error::shift-summary returned $code"; exit 1; }

  nightly:
    name: Nightly AI failure predictions
    if: github.event.schedule == '0 0 * * *' || github.event.inputs.target == 'nightly' || github.event.inputs.target == 'all'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger nightly cron
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -uo pipefail
          code=$(curl -sS -o /tmp/body -w "%{http_code}" -X POST \
            -H "X-Cron-Secret: $CRON_SECRET" "$API_URL/v1/internal/ai/failure-predictions" || echo "000")
          echo "HTTP $code"; cat /tmp/body 2>/dev/null; echo
          [ "$code" = "200" ] || { echo "::error::ai/failure-predictions returned $code"; exit 1; }

  cleanup:
    name: Expired-logbook cleanup
    if: github.event.schedule == '0 3 * * *' || github.event.inputs.target == 'cleanup' || github.event.inputs.target == 'all'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger cleanup cron
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -uo pipefail
          code=$(curl -sS -o /tmp/body -w "%{http_code}" -X POST \
            -H "X-Cron-Secret: $CRON_SECRET" "$API_URL/v1/internal/logbook/cleanup-expired" || echo "000")
          echo "HTTP $code"; cat /tmp/body 2>/dev/null; echo
          [ "$code" = "200" ] || { echo "::error::logbook/cleanup-expired returned $code"; exit 1; }

  billing:
    name: Month-end Stripe true-up
    if: github.event.schedule == '0 0 28-31 * *' || github.event.inputs.target == 'billing' || github.event.inputs.target == 'all'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger billing true-up cron
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -uo pipefail
          code=$(curl -sS -o /tmp/body -w "%{http_code}" -X POST \
            -H "X-Cron-Secret: $CRON_SECRET" "$API_URL/v1/internal/billing/monthly-trueup" || echo "000")
          echo "HTTP $code"; cat /tmp/body 2>/dev/null; echo
          [ "$code" = "200" ] || { echo "::error::billing/monthly-trueup returned $code"; exit 1; }
