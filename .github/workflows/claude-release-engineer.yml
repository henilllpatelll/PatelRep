name: Claude Release Engineer

# Autonomous CI-repair agent (Phase 1: repair only — no auto-merge, no auto-release).
# Runs only after an upstream workflow FAILED (or on manual dispatch). Claude never receives
# production credentials; privileged work stays in the dedicated production workflows.

on:
  workflow_dispatch:
    inputs:
      failed_run_id:
        description: Failed workflow run id to diagnose (leave empty for a general task)
        required: false
        type: string
      instructions:
        description: Optional task instructions for the release engineer
        required: false
        type: string
  workflow_run:
    workflows:
      - CI
      - Staging Candidate
      - Production Migration Evidence Audit
      - Production Release
    types: [completed]

# One agent per failed upstream run; never cancel an agent mid-repair.
concurrency:
  group: claude-release-engineer-${{ github.event.workflow_run.id || inputs.failed_run_id || github.run_id }}
  cancel-in-progress: false

permissions:
  contents: read
  actions: read
  pull-requests: read
  issues: read
  checks: read

jobs:
  repair:
    name: Diagnose and repair
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # Successful upstream runs never invoke Claude. Fork runs are ignored (untrusted logs/code), and
    # recovery branches are not auto-retried so a failing fix cannot loop; dispatch manually instead.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'failure' &&
       github.event.workflow_run.head_repository.full_name == github.repository &&
       !startsWith(github.event.workflow_run.head_branch, 'claude/recovery-'))
    steps:
      # Trusted copy of the resolver from the default branch; the repair checkout comes afterwards.
      - uses: actions/checkout@v7
        with:
          path: .trusted-resolver
          sparse-checkout: scripts
          persist-credentials: false

      # Deterministically resolve the exact failing code. Fails closed (no Claude) if it cannot be proven.
      - name: Resolve repair context
        id: ctx
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          RUN_JSON: ${{ toJSON(github.event.workflow_run) }}
          INPUT_RUN_ID: ${{ inputs.failed_run_id }}
        run: |
          node .trusted-resolver/scripts/resolve-release-engineer-context.mjs
          rm -rf .trusted-resolver

      - name: Create PatelRep GitHub App token
        id: app-token
        if: steps.ctx.outputs.skip != 'true'
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.PATELREP_APP_CLIENT_ID }}
          private-key: ${{ secrets.PATELREP_APP_PRIVATE_KEY }}

      - uses: actions/checkout@v7
        if: steps.ctx.outputs.skip != 'true'
        with:
          token: ${{ steps.app-token.outputs.token }}
          ref: ${{ steps.ctx.outputs.repair_sha }}
          fetch-depth: 0

      - uses: actions/setup-node@v7
        if: steps.ctx.outputs.skip != 'true'
        with:
          node-version: "22"

      - uses: actions/setup-python@v7
        if: steps.ctx.outputs.skip != 'true'
        with:
          python-version: "3.12"

      - name: Position repair branch at the exact failing commit
        if: steps.ctx.outputs.skip != 'true'
        env:
          REPAIR_SHA: ${{ steps.ctx.outputs.repair_sha }}
          REPAIR_BRANCH: ${{ steps.ctx.outputs.repair_branch }}
        run: |
          git config user.name "patelrep-release-engineer[bot]"
          git config user.email "patelrep-release-engineer[bot]@users.noreply.github.com"
          test "$(git rev-parse HEAD)" = "$REPAIR_SHA"
          git switch -c "$REPAIR_BRANCH"

      - name: Run Claude release engineer
        if: steps.ctx.outputs.skip != 'true'
        uses: anthropics/claude-code-action@v1
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ steps.app-token.outputs.token }}
          additional_permissions: |
            actions: read
          prompt: |
            You are the PatelRep autonomous release engineer for ${{ github.repository }}.
            Before acting, read CLAUDE.md and docs/AUTONOMOUS_RELEASE_ENGINEER.md in full and obey them,
            including the database safety invariants and the production authority model.

            Trigger: ${{ github.event_name }}
            Upstream workflow: ${{ steps.ctx.outputs.upstream_workflow }}
            Root failed workflow run id: ${{ steps.ctx.outputs.root_failed_run_id }}
            Repair SHA (exact failing code, already checked out): ${{ steps.ctx.outputs.repair_sha }}
            Repair branch (already created locally at the repair SHA): ${{ steps.ctx.outputs.repair_branch }}
            Repair PR number (empty means none): ${{ steps.ctx.outputs.repair_pr_number }}
            Manual instructions: ${{ inputs.instructions || 'none' }}

            Always begin from the exact failing code at the repair SHA; do not switch to main.
            Follow the failure-repair procedure in the document: establish the root cause from the root
            failed run's jobs, logs and artifacts first; make the smallest deterministic fix with a
            regression test; run targeted tests locally; then push once.
            If the repair PR number is set, it is an open same-repository PR: push to its existing branch
            (the repair branch) and do not open another PR. Otherwise push the repair branch
            claude/recovery-<root failed run id> and open a PR to main.
            Never push directly to main (no git push origin main, no HEAD:main, no force pushes) and do
            not merge. Do not dispatch Production Release.
          claude_args: >-
            --max-turns 60
            --allowedTools "Read,Write,Edit,MultiEdit,Glob,Grep,Bash(git:*),Bash(gh:*),Bash(node:*),Bash(npm:*),Bash(npx:*),Bash(python:*),Bash(python3:*),Bash(pip:*),Bash(pytest:*),Bash(cd:*),Bash(ls:*),Bash(cat:*),Bash(mkdir:*),Bash(unzip:*),mcp__github_ci__get_ci_status,mcp__github_ci__get_workflow_run_details,mcp__github_ci__download_job_log"
            --disallowedTools "Bash(git push --force:*),Bash(git push -f:*),Bash(git push --force-with-lease:*),Bash(git push * --force*),Bash(git push * -f*),Bash(git push * +*),Bash(git push origin main:*),Bash(git push -u origin main:*),Bash(git push --set-upstream origin main:*),Bash(git push origin HEAD:main:*),Bash(git push origin HEAD:refs/heads/main:*),Bash(git push origin refs/heads/main:*),Bash(gh pr merge:*),Bash(gh workflow run production-release*),Bash(supabase:*),Bash(railway:*),Bash(psql:*)"
